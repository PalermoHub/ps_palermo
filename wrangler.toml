name = "palermo-ps"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Sito statico servito dallo stesso Worker; /api/* passa prima dal codice.
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Esegue il Worker (cron compreso) a Milano: Riuniti e ARNAS Civico non rispondono a IP di datacenter esteri (ipotesi: filtro geografico).
[placement]
region = "aws:eu-south-1"

[triggers]
crons = ["*/5 * * * *"]

# Binding a sé stesso: il cron lo usa per far girare lo scraping nella regione di placement.
[[services]]
binding = "SELF"
service = "palermo-ps"

# Storico delle letture (grafici e archivio CSV). Migrazioni: npx wrangler d1 migrations apply palermo-ps-storico --remote
[[d1_databases]]
binding = "DB"
database_name = "palermo-ps-storico"
database_id = "63189855-2210-4d8c-9f41-1e7f63d0d75d"
migrations_dir = "migrations"

# Limite per IP sugli endpoint pubblici (30 richieste/min); il contatore è per sede Cloudflare, quindi è un freno e non un tetto esatto.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60
