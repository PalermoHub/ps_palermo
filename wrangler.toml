name = "palermo-ps"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Sito statico servito dallo stesso Worker; /api/* passa prima dal codice.
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Esegue il Worker (cron compreso) a Milano: Riuniti e ARNAS Civico non rispondono a IP di datacenter esteri (ipotesi: filtro geografico).
[placement]
region = "aws:eu-south-1"

[triggers]
crons = ["*/2 * * * *"]

# Namespace creato con: npx wrangler kv namespace create PS_KV
[[kv_namespaces]]
binding = "PS_KV"
id = "7da51ffb54f741789be80b9baf7d96e9"
