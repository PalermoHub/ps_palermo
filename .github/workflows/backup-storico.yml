name: Backup storico dati

# Ogni notte copia lo storico (D1) in dati/storico/AAAA/AAAA-MM-GG.csv (backup) e ricalcola dati/storico/heatmap.json,
# che il sito legge da raw.githubusercontent.com per la heatmap. Poi scripts/aggrega.mjs crea i CSV di settimane e mesi chiusi
# e dati/storico/indice.json, da cui il sito offre i download (statici: non costano letture D1).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      giorno:
        description: 'Giorno da salvare (YYYY-MM-DD, ora di Palermo). Vuoto = ieri.'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
      SITO: ${{ vars.SITO_URL || 'https://palermo-ps.coseerobe.workers.dev' }}
    steps:
      - name: Token mancante
        if: ${{ env.EXPORT_TOKEN == '' }}
        run: echo "::error::Imposta il secret EXPORT_TOKEN (lo stesso del Worker)." && exit 1
      - uses: actions/checkout@v4
      - name: Scarica il CSV del giorno
        run: |
          GIORNO="${{ github.event.inputs.giorno }}"
          [ -z "$GIORNO" ] && GIORNO=$(TZ=Europe/Rome date -d yesterday +%F)
          mkdir -p "dati/storico/${GIORNO:0:4}"
          curl -fsS -H "Authorization: Bearer $EXPORT_TOKEN" "$SITO/api/export.csv?day=$GIORNO" -o "dati/storico/${GIORNO:0:4}/$GIORNO.csv"
          echo "righe: $(($(wc -l < dati/storico/${GIORNO:0:4}/$GIORNO.csv) - 1))"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ricalcola la heatmap dai CSV
        run: node scripts/heatmap.mjs
      - name: Crea i file settimanali e mensili e l'indice dei download
        run: node scripts/aggrega.mjs
      - name: Commit
        run: |
          git config user.name "backup-storico"
          git config user.email "actions@users.noreply.github.com"
          git add dati/storico
          git diff --cached --quiet || (git commit -m "Backup storico $(date -u +%F)" && git pull --rebase && git push)
      # Allarme: se il backup fallisce si apre una issue (una sola, finché resta aperta); al primo successo si chiude.
      - name: Segnala il fallimento
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Allarme dati: backup notturno fallito"
          gh label create allarme-dati --color d93f0b --description "Fonte ferma o dati non aggiornati (automatica)" 2>/dev/null || true
          N=$(gh issue list --label allarme-dati --state open --search "\"$T\" in:title" --json number --jq '.[0].number // empty')
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$N" ]; then gh issue create --title "$T" --label allarme-dati --body "Il backup notturno dello storico non è riuscito: $URL. Il giorno mancante si recupera lanciando il workflow a mano (campo «giorno»). Si chiude da sola al primo backup riuscito."; else gh issue comment "$N" --body "Fallito di nuovo: $URL"; fi
      - name: Chiudi l'allarme se rientrato
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --label allarme-dati --state open --search "\"Allarme dati: backup notturno fallito\" in:title" --json number --jq '.[0].number // empty')
          [ -n "$N" ] && gh issue comment "$N" --body "Backup riuscito: chiudo." && gh issue close "$N" || true
