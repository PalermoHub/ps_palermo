name: Diagnosi fonti (manuale)

on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Legge le fonti più delicate dai server di GitHub
        run: |
          for url in \
            "https://www.ospedaliriunitipalermo.it/amministrazione-trasparente/servizi-erogati/liste-di-attesa/pazienti-in-attesa-al-pronto-soccorso/" \
            "https://www.arnascivico.it/index.php?option=com_content&view=article&id=3415&catid=24&Itemid=139"; do
            for i in 1 2 3; do
              curl -s -o /tmp/p.html -m 25 -A "palermo-ps/0.1 (monitor pubblico tempi di attesa)" \
                -w "$(echo "$url" | cut -d/ -f3) prova $i: HTTP %{http_code} in %{time_total}s, %{size_download} byte\n" "$url" || echo "$(echo "$url" | cut -d/ -f3) prova $i: errore curl $?"
              sleep 5
            done
          done
